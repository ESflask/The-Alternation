# XcodeGen 仕様ファイル
# 生成: このディレクトリ内で `xcodegen generate` を実行すると VibeConnectApp.xcodeproj が作られる。
# sources はフォルダ単位で glob しているため、Agent 5 が追加する
# VibeConnectApp/Networking/ ・ VibeConnectApp/ViewModels/ も自動的にビルド対象へ含まれる。

name: VibeConnectApp

options:
  bundleIdPrefix: com.mamekenn
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  VibeConnectApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      # フォルダをそのまま glob（Networking/・ViewModels/ も自動包含）
      - path: VibeConnectApp
    info:
      # XcodeGen が下記プロパティで Info.plist を生成し INFOPLIST_FILE に設定する
      path: Info.plist
      properties:
        CFBundleDisplayName: The Alternation
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # Tailscale IP への http:// アクセスを許可するための ATS 例外
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # ローカル/プライベートネットワーク利用の説明（iOS の権限プロンプト用）
        NSLocalNetworkUsageDescription: "Mac 上の The Alternation サーバー（Tailscale）へ接続するためにローカルネットワークを使用します。"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mamekenn.vibeconnect
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: "23463RRK7R"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
